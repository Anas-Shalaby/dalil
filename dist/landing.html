        var html = document.documentElement;
        var savedTheme = localStorage.getItem('dalil-theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme ? savedTheme === 'dark' : systemDark) {
          html.classList.add('dark');
        }
        var savedLang = localStorage.getItem('dalil-lang');
        if (savedLang === 'en') {
          html.lang = 'en';
          html.dir = 'ltr';
        } else {
          html.lang = 'ar';
          html.dir = 'rtl';

      })();
